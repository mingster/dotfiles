name: Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run changed script tests
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          PROJECT_NAMES_PATTERN: ${{ secrets.PROJECT_NAMES_PATTERN }}
        run: |
          set -euo pipefail
          # Secret is empty on forks or until set: no file, so the guard test skips.
          if [ -n "${PROJECT_NAMES_PATTERN:-}" ]; then
            NO_PROJECT_NAMES_FILE=$(mktemp)
            trap 'rm -f "$NO_PROJECT_NAMES_FILE"' EXIT
            printf '%s\n' "$PROJECT_NAMES_PATTERN" >"$NO_PROJECT_NAMES_FILE"
            export NO_PROJECT_NAMES_FILE
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            mapfile -t changed < <(git diff --diff-filter=d --name-only "$GITHUB_SHA^1" "$GITHUB_SHA")
          else
            if [ -z "${GITHUB_BEFORE_SHA:-}" ] || [ "$GITHUB_BEFORE_SHA" = '0000000000000000000000000000000000000000' ]; then
              changed=()
            else
              mapfile -t changed < <(git diff --diff-filter=d --name-only "$GITHUB_BEFORE_SHA" "$GITHUB_SHA")
            fi
          fi
          bash script/select-changed-script-tests.sh "${changed[@]+"${changed[@]}"}"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run ShellCheck
        run: bash script/shellcheck-dotfiles.sh
