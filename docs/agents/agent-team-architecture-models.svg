  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Supported Model Providers &amp; Harnesses</text>
</g>
<polyline class="edge" data-from="Providers" data-to="Orchestration" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="397.01249999999993,170.7 397.01249999999993,268.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
