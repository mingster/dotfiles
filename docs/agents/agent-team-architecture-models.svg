  <text x="388.8614999999999" y="119.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="388.8614999999999" dy="-12.350000000000001">Anthropic Claude Code</tspan><tspan x="388.8614999999999" dy="16.900000000000002">(see model-routing.md)</tspan><tspan x="388.8614999999999" dy="16.900000000000002">via .claude/agents/*.md</tspan></text>
