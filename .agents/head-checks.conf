# Ordered dotfiles checks; source and tests are never rewritten.
files=({files}); targets=(); for f in ${files[@]+"${files[@]}"}; do case "$f" in *.sh|.agents/head-checks.conf) [ ! -f "$f" ] || targets+=("$f") ;; esac; done; if [ ${#targets[@]} -gt 0 ]; then shellcheck -s bash --severity=error "${targets[@]}"; fi
files=({files}); for f in ${files[@]+"${files[@]}"}; do case "$f" in *.sh|.agents/head-checks.conf) [ ! -f "$f" ] || bash -n "$f" ;; esac; done
bash script/tests/lead-merge.test.sh
bash script/tests/head-checks.test.sh
bash script/tests/no-pgrep-wait.test.sh
