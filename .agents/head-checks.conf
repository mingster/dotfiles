# Ordered dotfiles checks; source and tests are never rewritten.
files=({files}); targets=(); for f in ${files[@]+"${files[@]}"}; do case "$f" in *.sh|.agents/head-checks.conf|.agents/head-checks-docs.conf) [ ! -f "$f" ] || targets+=("$f") ;; esac; done; if [ ${#targets[@]} -gt 0 ]; then shellcheck -s bash --severity=error "${targets[@]}"; fi
files=({files}); for f in ${files[@]+"${files[@]}"}; do case "$f" in *.sh|.agents/head-checks.conf|.agents/head-checks-docs.conf) [ ! -f "$f" ] || bash -n "$f" ;; esac; done
bash script/tests/no-project-names.test.sh
bash script/tests/no-project-names-guard.test.sh
bash script/tests/no-pgrep-wait.test.sh
bash script/tests/pipeline-wiring.test.sh
bash script/tests/release-guard-rules.test.sh
bun test script/head-checks-contract.test.ts
python3 -m unittest script/tests/test_clean_finished.py -q
SELECT_SCRIPT_TESTS_SKIP=/dev/null bash script/select-changed-script-tests.sh {files}
